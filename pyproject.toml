[project]
name = "tarang-receipts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas", "pillow", "imagehash", "pydantic>=2", "google-genai", "httpx", "python-dotenv", "rapidfuzz"]

[project.optional-dependencies]
dev = ["pytest"]
fetch = ["playwright"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
